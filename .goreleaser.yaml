# GoReleaser builds cross-platform `clux` binaries and publishes them to a
# GitHub Release on every pushed `vX.Y.Z` tag. See .github/workflows/release.yml.
version: 2

project_name: clux

before:
  hooks:
    - go mod tidy

builds:
  - id: clux
    main: ./cmd/clux
    binary: clux
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # Version-less archive names so install.sh can fetch a stable filename
  # without first resolving the release version.
  - id: clux
    name_template: "clux_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

# checksums.txt.sig: ed25519 signature over the tag and checksums.txt (see
# internal/selfupdate/signature.go). `clux update` and the native root
# daemon refuse a release from v0.7.0 on without a valid one. The tool
# refuses a key the binary does not trust, so a wrong or missing secret
# fails the release before anything is published.

release:
  github:
    owner: eduardkumskyi
    name: clux-cli
  # Published as a draft; the release workflow signs checksums.txt,
  # verifies it, then publishes (see .github/workflows/release.yml).
  draft: true
  prerelease: auto

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
